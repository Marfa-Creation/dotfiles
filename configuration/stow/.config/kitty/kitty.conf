map ctrl+shift+right 
map ctrl+shift+left
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+t launch --cwd=current --type=tab
map ctrl+shift+/ show_scrollback
map ctrl+shift+i set_background_opacity +0.1
map ctrl+shift+d set_background_opacity -0.1
background_opacity         0.7
dynamic_background_opacity yes
cursor_trail 1
cursor_trail_decay 0.2 0.5

allow_remote_control yes

font_family      JetBrainsMonoNLNerdFont
bold_font        auto
italic_font      auto
bold_italic_font auto

selection_background #7aa2f7
selection_foreground #f7f7f7

foreground            #c0caf5
background            #24283b
cursor                #c0caf5

active_tab_foreground   #24283b
active_tab_background   #7aa2f7
inactive_tab_foreground #f7f7f7
inactive_tab_background #24283B
tab_bar_background      #24283B

color0  #414868 
color1  #f7768e    
color2  #9ece6a    
color3  #ff9e64 
color4  #7aa2f7    
color5  #F7768E 
color6  #7dcfff    
color7  #c0caf5 

